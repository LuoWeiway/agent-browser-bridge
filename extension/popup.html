<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 330px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 14px;
      color: #333;
      background: #fafafa;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e5e5;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 600;
      font-size: 15px;
      color: #111;
    }
    .version {
      font-size: 11px;
      color: #888;
      margin-left: 4px;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 500;
    }
    .badge-ok { background: #e6f7ed; color: #027a48; }
    .badge-err { background: #feefef; color: #b42318; }
    .badge-warn { background: #fffbeb; color: #b45309; }

    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .info-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .label {
      font-size: 11px;
      color: #666;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .val {
      font-size: 12px;
      color: #111;
      word-break: break-all;
      line-height: 1.4;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    button {
      flex: 1;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover {
      background: #1d4ed8;
    }
    button.btn-sec {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    button.btn-sec:hover {
      background: #e2e8f0;
    }
    button.btn-danger {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    button.btn-danger:hover {
      background: #fecaca;
    }

    #feedbackBox {
      display: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      margin-top: 8px;
      line-height: 1.4;
    }

    .tip {
      font-size: 11px;
      color: #888;
      margin-top: 10px;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Agent Browser Bridge <span class="version">v2.3.0</span></div>
    <div id="statusBadge" class="badge badge-err">检测中...</div>
  </div>

  <div class="info-card">
    <div class="status-row">
      <span>守护服务 (127.0.0.1:18888)</span>
      <strong id="daemonStatus">检测中...</strong>
    </div>
    <div class="status-row">
      <span>Chrome 扩展客户端</span>
      <strong id="clientStatus">检测中...</strong>
    </div>
  </div>

  <div class="info-card">
    <div class="label">当前激活标签页</div>
    <div id="tabTitle" class="val">获取中...</div>
    <div id="tabUrl" class="val" style="color: #666; margin-top: 4px; font-size: 11px;"></div>
  </div>

  <div class="btn-group">
    <button id="testReadBtn">⚡ 测试读取当前页</button>
    <button id="reconnectBtn" class="btn-sec">🔄 重新连接</button>
  </div>

  <div class="btn-group">
    <button id="cleanGroupBtn" class="btn-danger">🧹 清理 Agent 任务标签</button>
  </div>

  <div id="feedbackBox"></div>

  <div class="tip">
    终端运行 <code>node server.js doctor</code> 可进行全链路自检诊断
  </div>

  <script src="popup.js"></script>
</body>
</html>
