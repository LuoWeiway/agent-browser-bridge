<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 14px;
      color: #333;
      background: #fafafa;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e5e5;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 600;
      font-size: 15px;
      color: #111;
    }
    .badge {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 500;
    }
    .badge-ok { background: #e6f7ed; color: #027a48; }
    .badge-err { background: #feefef; color: #b42318; }
    .info-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .label {
      font-size: 11px;
      color: #666;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .val {
      font-size: 12px;
      color: #111;
      word-break: break-all;
      line-height: 1.4;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    .tip {
      font-size: 11px;
      color: #888;
      margin-top: 10px;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Agent Browser Bridge</div>
    <div id="status" class="badge badge-err">检查中...</div>
  </div>

  <div class="info-card">
    <div class="label">当前标签页</div>
    <div id="tabTitle" class="val">获取中...</div>
    <div id="tabUrl" class="val" style="color: #666; margin-top: 4px;"></div>
  </div>

  <button id="reconnectBtn">🔄 重新连接 Bridge 服务</button>
  <div class="tip">守护服务: 127.0.0.1:18888<br>与 CLI 及 Claude MCP 保持实时同步</div>

  <script src="popup.js"></script>
</body>
</html>
